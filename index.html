<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Proposta Comercial de Marketing Digital Completo — CNA Ocian.">
  <title>Proposta Comercial • CNA Ocian</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bgline" aria-hidden="true"></div>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>

  <main class="deck" id="deck" aria-live="polite"></main>

  <nav class="controls" aria-label="Controles da apresentação">
    <button class="control" id="prev" type="button" aria-label="Slide anterior">←</button>
    <div class="progress-wrap">
      <div class="progress" id="progress"></div>
    </div>
    <span class="counter" id="counter">01 / 13</span>
    <button class="control" id="next" type="button" aria-label="Próximo slide">→</button>
    <button class="control control-small" id="fullscreen" type="button" aria-label="Tela cheia"><span aria-hidden="true">⛶</span><span class="fullscreen-text">Tela cheia</span></button>
  </nav>
  <div class="fullscreen-message" id="fullscreen-message" role="status" aria-live="polite" hidden></div>

  <div class="dots" id="dots" aria-label="Navegação por slides"></div>
  <div class="hint">← → / espaço • deslize no celular</div>

  <script src="js/slides.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
